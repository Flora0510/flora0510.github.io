# Textes qui varient d'un site à l'autre, pour les pages dont la structure
# (liste de livres, etc.) reste la même partout. Modifie directement les
# valeurs ci-dessous — pas besoin de toucher aux fichiers .html/.md.
#
# Clé "commun" = site commun (quand filtre_auteure est vide).
# Clés "lora" / "carolyn" = sites personnels, doivent correspondre à
# filtre_auteure dans _config_lora.yml / _config_carolyn.yml.
#
# Pour "animations" et "animations_biblio", le champ "references" est une
# liste de blocs affichés en pleine largeur sous la grille (ex. Répertoire
# culture-éducation, UNEQ). Chaque bloc : titre, texte, et un lien optionnel
# (lien + lien_texte). Laisse la liste vide ([]) si rien à afficher.

commun:
  accueil:
    titre: "Des livres jeunesse à lire et à vivre"
    texte: "Deux autrices, des aventures pleines d'énigmes, et des animations pour donner le goût de lire aux jeunes!"
    propositions:
      - titre: "Bandits des mers"
        texte: "Lora Boisvert et Carolyn Chouinard te proposent une expérience immersive alliant littérature et réalité augmentée. Grâce à l'application Les Éditions AppLit, plonge au cœur de l'intrigue, observe les décors à 360 degrés et résous les énigmes!"
      - titre: "Animations scolaires"
        texte: "Carolyn et Lora visitent les écoles et bibliothèques pour partager leur passion pour l'écriture."
      - titre: "Parcours littéraire"
        texte: "Une façon ludique d'intégrer les arts numériques et la littérature en classe ou en bibliothèque."
  livres:
    intro: "Voici les livres de Carolyn et Lora."
  a_propos:
    image: /assets/images/auteures/commun.jpg
    texte: "Fondées en 2022, les Éditions AppLit ont été créées par deux auteures jeunesse. Lora Boisvert et Carolyn Chouinard ont d’abord joint leur passion afin d’offrir aux jeunes lecteurs des récits écrits à quatre mains. Après l'obtention de son BACC en Communication, profil médias interactifs, Lora a eu l’idée d’amalgamer littérature et technologie en créant une application mobile offrant des compléments interactifs et immersifs au livre papier. Des visuels en 360°, des énigmes à résoudre ainsi que la réalité augmentée ne sont que quelques-uns des éléments utilisés pour créer un contenu littéraire novateur. Une formule idéale pour entretenir le plaisir de lire, qui se retrouve au cœur de leur mission."
  animations:
    references:
      - titre: "Le Répertoire culture-éducation"
        texte: "Carolyn et Lora sont membres du répertoire culture-éducation. Vous pouvez inviter les auteures dans votre classe pour une des animations suivantes grâce au volet <a href='https://www.quebec.ca/education/prescolaire-primaire-et-secondaire/ressources-outils-reseau-scolaire/culture-education/culture-ecole/ateliers-culturels-ecole' target='_blank' rel='noopener'>Ateliers culturels à l'école</a>. Selon la région et les ressources disponibles, l'aide financière peut atteindre 100 % des dépenses admissibles. Pour plus de détails, les enseignants peuvent s'adresser à leur direction d'école."
  animations_biblio:
    intro: "Carolyn et Lora sont membres de l'UNEQ. Si vous êtes une bibliothèque, un organisme à caractère culturel, une librairie, un lieu de diffusion culturel, un collège ou une université au Canada, vous pouvez les recevoir à faible coût grâce au programme Tournées-rencontres. Vous aurez des frais de gestion de 80$ + taxes à payer, et le cachet ainsi que les frais de déplacement de l'auteure seront pris en charge par l'UNEQ. Consultez le <a href='https://www.uneq.qc.ca/services/programmes-de-rencontres/tournees-rencontre/' target='_blank' rel='noopener'>site de l'UNEQ</a> pour connaître les dates limites."
    references: []
  zone_profs:
    propositions:
      - titre: "Jeu d'évasion littéraire - Aventuriers des mers"
        texte: "Une aventure littéraire qui propose une série d'énigmes et d'interactions en lien étroit avec un extrait du roman Aventuriers des mers."
        lien: "/zone-profs/jeu-evasion-aventuriers/"
      - titre: "Jeu d'évasion littéraire - Le détenu de Trois-Rivières"
        texte: "Une aventure littéraire qui propose une série d'énigmes et d'interactions en lien étroit avec un extrait du roman Le détenu de Trois-Rivières."
        lien: "/zone-profs/jeu-evasion-coince-dans-lhistoire/"
      - titre: "Bandits des mers"
        texte: "Une expérience immersive alliant littérature et réalité augmentée. Grâce à l'application Les Éditions AppLit, plonge au cœur de l'intrigue, observe les décors à 360 degrés et résous les énigmes!"
        lien: "/zone-profs/bandits-des-mers/"
      - titre: "Fiches pédagogiques"
        texte: "Découvrez les fiches pédagogiques en lien avec les romans des auteures."
        lien: "/zone-profs/fiches-pedagogiques/"
      - titre: "Animations scolaires"
        texte: "Carolyn et Lora visitent les écoles pour partager leur passion pour l'écriture. Elles sont membres du répertoire Culture-Éducation."
        lien: "/animations/"
      - titre: "Parcours littéraire"
        texte: "Une façon ludique d'intégrer les arts numériques et la littérature en classe."
        lien: "/parcours-litteraire/"
  zone_biblio:
    propositions:
      - titre: "Parcours littéraire"
        texte: "Une façon ludique d'intégrer les arts numériques et la littérature en bibliothèque."
        lien: "/parcours-litteraire/"
      - titre: "Bandits des mers"
        texte: "Une expérience immersive alliant littérature et réalité augmentée. Grâce à l'application Les Éditions AppLit, plonge au cœur de l'intrigue, observe les décors à 360 degrés et résous les énigmes!"
        lien: "/zone-profs/bandits-des-mers/"
      - titre: "Animations"
        texte: "Carolyn et Lora visitent les bibliothèques pour partager leur passion pour l'écriture."
        lien: "/animations-biblio/"

