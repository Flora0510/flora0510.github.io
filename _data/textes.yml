    texte_apres: "Si vous êtes une bibliothèque, un organisme à caractère culturel (événement, maison de la culture, musée, galerie d’art, etc.), une librairie, un lieu de diffusion culturel, un collège ou une université au Canada. Vous pouvez recevoir nos auteurs grâce au programme Tournées-rencontres.

Cela vous permettra de recevoir les auteures à plus faible coût. Vous aurez des frais de gestion de 80$ + taxes à payer et le cachet ainsi que les frais de déplacement de l'auteure seront pris en charge par l'UNEQ.

Il y a des dates limites pour faire vos demandes, alors consultez le site de l'UNEQ et faites vos demandes en avance."

