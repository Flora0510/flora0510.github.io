{% assign a = include.auteure %}
{% if a.facebook %}
<a href="{{ a.facebook }}" target="_blank" rel="noopener" aria-label="Facebook de {{ a.nom }}">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
</a>
{% endif %}
{% if a.instagram %}
<a href="{{ a.instagram }}" target="_blank" rel="noopener" aria-label="Instagram de {{ a.nom }}">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
</a>
{% endif %}
{% if a.tiktok %}
<a href="{{ a.tiktok }}" target="_blank" rel="noopener" aria-label="TikTok de {{ a.nom }}">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.5 3c.4 2 1.9 3.6 4 4v3a7 7 0 0 1-4-1.3v6.6a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v3.1a2.6 2.6 0 1 0 1.8 2.5V3h3Z"/></svg>
