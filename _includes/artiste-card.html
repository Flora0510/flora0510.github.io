
<a class="ressource-item animation-card"
   href="{{ include.projet.url | relative_url }}">

  {% if include.projet.image %}
    <img
      src="{{ include.projet.image | relative_url }}"
      alt="{{ include.projet.title }}"
      style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem;"
    >
  {% endif %}

  <h3 style="margin-bottom: 0.3rem;">
    {{ include.projet.title }}
  </h3>

  <p style="font-size: 0.97rem; color: var(--color-ink-soft); margin: 0; line-height: 1.55;">
    {{ include.projet.description | default: include.projet.content | strip_html | truncatewords: 30 }}
  </p>

  <span style="display: inline-block; margin-top: 1rem;">
    Découvrir le projet →
  </span>
</a>
