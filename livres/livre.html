---
layout: default
---
<article class="wrap" style="padding: 3rem 0;">
  <p><a href="{{ '/livres/' | relative_url }}">← Retour aux livres</a></p>
  <div class="livre-detail">
    <div class="book-cover">
      <img src="{{ page.image | relative_url }}" alt="Couverture de {{ page.title }}">
    </div>
    <div>
      <h1>{{ page.title }}</h1>
      {% if page.serie %}<p style="color: var(--color-navy); font-weight:700;">{{ page.serie }}</p>{% endif %}
      <div>{{ content }}</div>
      {% if page.lien_achat %}
        <p><a class="btn" href="{{ page.lien_achat }}" target="_blank" rel="noopener">Se procurer ce livre →</a></p>
      {% endif %}
    </div>
  </div>
</article>
